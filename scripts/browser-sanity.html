<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>QADDONS — synthetic browser sanity</title>
<style>
    body { background:#15202b; color:white; margin:0; }
    .game-window-positioner { position:relative; width:1000px; height:720px; }
    .game-layer { width:600px; height:400px; margin:100px 180px; }
    #GAME_CANVAS { width:600px; height:400px; background:#182f26; }
    .interface-layer { position:absolute; inset:0; pointer-events:none; }
    .positioner.top { position:absolute; width:1000px; height:60px; }
    .top-left.main-buttons-container { display:flex; gap:5px; height:44px; pointer-events:auto; }
    .left-column { position:absolute; width:150px; height:550px; }
    .right-column { position:absolute; right:0; width:150px; height:550px; }
    .positioner.bottom { position:absolute; top:550px; width:1000px; height:100px; }
    .hp-indicator-wrapper { position:absolute; left:470px; width:60px; height:60px; }
    .loot-wnd { position:fixed; left:280px; top:200px; width:420px; height:240px; background:#20252b; z-index:100; }
    .loot-window { margin:20px; width:380px; height:180px; }
    .loot-item-wrapper { display:inline-block; margin:10px; width:80px; height:100px; }
    .item { width:32px; height:32px; background:#a58626; }
    .accept-button .button { width:80px; height:25px; }
    .mAlert-layer .big-messages { position:fixed; top:20px; }
</style>
<div class="game-window-positioner">
    <div class="game-layer"><canvas id="GAME_CANVAS"></canvas></div>
    <div class="interface-layer">
        <div class="positioner top"><div class="top-left main-buttons-container"><button class="widget-button">GRA</button></div></div>
        <div class="left-column main-column"></div>
        <div class="right-column main-column"></div>
        <div class="positioner bottom"><div class="bottom-panel-of-bottom-positioner"><div class="hp-indicator-wrapper"></div></div></div>
    </div>
</div>
<div class="mAlert-layer"><div class="big-messages"><span style="font-size:15px;color:rgb(160, 170, 180)">Komunikat</span></div></div>
<div class="console-layer" style="top:17px">Konsola</div>
<pre id="result">RUNNING</pre>
<script>
    window.fixtureErrors = [];
    const originalConsoleError = console.error.bind(console);
    console.error = (...args) => {
        fixtureErrors.push(args.map(value => value?.stack || String(value)).join(' '));
        originalConsoleError(...args);
    };
    window.addEventListener('error', event => fixtureErrors.push(event.message));
    window.addEventListener('unhandledrejection', event => fixtureErrors.push(String(event.reason)));
    localStorage.removeItem('margonem_toolkit_settings');
    window.Engine = {
        ev: 1000,
        items: {
            items: { bag: { id: 777, name: 'Torba podróżna', stat: 'rarity=normal' } },
            testMyItems: () => ({ expired: { id: 778, name: '<b>Stary przedmiot</b>', checkExpires: () => true } })
        },
        communication: {
            parseJSON(packet) {
                if (Array.isArray(packet)) { packet.forEach(value => this.parseJSON(value)); return; }
                if (!packet.loot) return;
                document.querySelector('.loot-wnd')?.remove();
                if (!packet.loot.init) return;
                const root = document.createElement('div');
                root.className = 'c-window loot-wnd';
                root.innerHTML = '<div class="loot-window"></div><div class="accept-button"><div class="button">Potwierdź</div></div>';
                for (const [id, item] of Object.entries(packet.item || {})) {
                    const card = document.createElement('div');
                    card.className = 'loot-item-wrapper';
                    const icon = document.createElement('div');
                    icon.className = `item item-id-${id}`;
                    if (/rarity=legendary/.test(item.stat)) {
                        if (item.loc === 'k') icon.dataset.frameManiaRarity = 'legendary';
                        else icon.dataset.itemType = 't-leg';
                    }
                    card.append(icon);
                    root.querySelector('.loot-window').append(card);
                }
                document.body.append(root);
                return 'parsed';
            }
        }
    };
    window.fixtureOriginalParser = Engine.communication.parseJSON;
</script>
<script src="./detector-sanity.js"></script>
<script src="./item-tools-sanity.js"></script>
<script src="./relogger-sanity.js"></script>
<script src="../dist/installer.user.js"></script>
<script>
    async function run() {
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const wait = delay => new Promise(resolve => setTimeout(resolve, delay));
        const startupDeadline = Date.now() + 5000;
        while (!window.__MARGONEM_TOOLKIT__?.addons && Date.now() < startupDeadline) await wait(20);
        assert(window.__MARGONEM_TOOLKIT__?.addons, 'Loader uruchomił runtime w kontekście strony');
        assert(typeof unsafeWindow === 'undefined', 'Runtime działa bez API Tampermonkey');
        const manager = __MARGONEM_TOOLKIT__.addons;
        const parser = Engine.communication.parseJSON;
        const gameLayer = document.querySelector('.game-layer');
        const initialPosition = gameLayer.style.position;
        const initialIsolation = gameLayer.style.isolation;
        const packet = (loc, legend = true) => ({ loot: { init: 1, endTs: 1030 }, item: {
            first: { loc, stat: legend ? 'rarity=legendary' : 'rarity=normal' },
            normal: { loc, stat: 'rarity=normal' }
        } });
        manager.changeSettings('legendary-notificator', { mute: true });
        __MARGONEM_TOOLKIT__.open();
        const updateStatus = document.querySelector('.mtk-update-status');
        const checkUpdates = document.querySelector('[data-check-update]');
        async function waitForUpdate(status) {
            const deadline = Date.now() + 3000;
            while (updateStatus.dataset.status !== status && Date.now() < deadline) await wait(20);
            assert(updateStatus.dataset.status === status, `Status aktualizacji: ${status}`);
        }
        await waitForUpdate('current');
        assert(document.querySelector('.mtk-version').textContent === `v${__MARGONEM_TOOLKIT__.version}`, 'Wersja runtime w nagłówku');
        assert(getComputedStyle(document.querySelector('.mtk-update-light')).backgroundColor === 'rgb(69, 223, 135)', 'Zielona lampka aktualnej wersji');
        checkUpdates.click();
        await waitForUpdate('outdated');
        assert(getComputedStyle(document.querySelector('.mtk-update-light')).backgroundColor === 'rgb(255, 91, 103)', 'Czerwona lampka nowej wersji');
        assert(updateStatus.textContent.includes('99.0.0'), 'Numer dostępnej wersji');
        checkUpdates.click();
        await waitForUpdate('error');
        checkUpdates.click();
        await waitForUpdate('current');
        assert(document.querySelectorAll('.mtk-addon').length === 10, 'Manager dziesięciu addonów');
        assert(document.querySelector('#qaddons-quick-seller')?.textContent === 'SPR', 'Przycisk Sprzedawczyka');
        assert(document.querySelector('#qaddons-enhancer-toggle')?.textContent === 'UL', 'Przycisk Ulepszarki');
        const partyFixture = document.createElement('div');
        partyFixture.className = 'party'; partyFixture.style.cssText = 'position:fixed;left:0;top:70px;width:290px';
        partyFixture.innerHTML = '<div class="party__list"><div class="party-member yellow" style="width:290px"><div class="member-hp-bar"></div><div class="table-wrapper"><div class="avatar"><div class="img-avatar-correct"></div></div><div class="info-wrapper"><div class="top-row"><div class="nickname"><div class="nickname-text">Bardzo długi nick postaci</div></div><div class="character-info">(492h|334h)</div></div><div class="bottom-row"><div class="hp-percent">(95%)</div><div class="hp-points">76 237 / 81 020</div><div class="info-icons"><div class="party__crown"></div></div></div></div></div></div></div><div class="party__professions">2b 1p 1m 1t 1h</div>';
        document.body.append(partyFixture); await wait(50);
        const partyMember = partyFixture.querySelector('.party-member');
        const partySummary = partyFixture.querySelector('.qaddons-party-summary');
        assert(partyMember.getBoundingClientRect().height === 18, 'Kompaktowy wiersz grupy ma 18 px');
        assert(getComputedStyle(partyFixture.querySelector('.avatar')).display === 'none', 'Grafika postaci ukryta');
        assert(getComputedStyle(partyFixture.querySelector('.hp-points')).display === 'none', 'Dokładne HP domyślnie ukryte');
        assert(getComputedStyle(partyFixture.querySelector('.top-row')).display === 'none', 'Natywny dwuwierszowy opis ukryty');
        assert(partySummary?.textContent.includes('Bardzo długi nick postaci') && partySummary.textContent.includes('(492h|334h)') && partySummary.textContent.includes('(95%)'), 'Własny wiersz zawiera nick, poziom i HP');
        assert(getComputedStyle(partySummary).fontSize === '9px', 'Kompaktowy tekst ma 9 px');
        assert(getComputedStyle(partyFixture.querySelector('.party__professions')).display !== 'none', 'Podsumowanie profesji pozostaje widoczne');
        partyFixture.querySelector('.nickname-text').textContent = 'Nowy nick';
        partyFixture.querySelector('.hp-percent').textContent = '(73%)'; await wait(50);
        assert(partySummary.textContent.includes('Nowy nick') && partySummary.textContent.includes('(73%)'), 'Wiersz reaguje na aktualizacje danych grupy');
        manager.changeSettings('compact-party', { hideAvatars: false, showHpPoints: true, rowHeight: 24 }); await wait(30);
        assert(getComputedStyle(partyFixture.querySelector('.avatar')).display === 'flex' && partySummary.textContent.includes('76 237 / 81 020'), 'Opcje przywracają avatar i pokazują dokładne HP');
        manager.changeSettings('compact-party', { hideAvatars: true, showHpPoints: false, rowHeight: 18, fontSize: 9 }); partyFixture.remove();
        await runDetectorChecks(manager, assert, wait);
        await runItemToolsChecks(manager, assert, wait);
        await runReloggerChecks(manager, assert, wait);
        const previousEnhancerItems = Engine.items.testMyItems;
        const previousGameCommand = window._g;
        const upgradeTarget = { id: 990, name: 'Zbroja testowa', cl: 8, st: 0, stat: 'rarity=heroic' };
        Engine.items.testMyItems = () => ({ target: upgradeTarget });
        window._g = command => {
            const id = Number(new URLSearchParams(command.split('&').slice(1).join('&')).get('item'));
            if (command.startsWith('enhancement&action=open')) setTimeout(() => Engine.communication.parseJSON({ enhancement: { itemId: id, upgradable: { upgradeLevel: 1, current: 5, max: 20 } } }), 0);
            if (command.startsWith('artisanship&action=open')) setTimeout(() => Engine.communication.parseJSON({ artisanship: { open: true } }), 0);
        };
        const draggedItem = document.createElement('div'); draggedItem.className = 'item item-id-990'; document.body.append(draggedItem);
        document.querySelector('#qaddons-enhancer-toggle').click();
        const enhancerSlot = document.querySelector('#qaddons-enhancer [data-slot="all"]');
        draggedItem.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, buttons: 1 }));
        enhancerSlot.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0 }));
        await wait(80);
        assert(document.querySelector('#qaddons-enhancer [data-slot="all"] strong').textContent === 'Zbroja testowa', 'Przeciągnięcie ustawia cel Ulepszarki');
        assert(!document.querySelector('#qaddons-enhancer .qe-slots').dataset.dragging, 'Stan przeciągania jest sprzątany');
        document.querySelector('#qaddons-enhancer [data-close]').click(); draggedItem.remove();
        Engine.items.testMyItems = previousEnhancerItems; window._g = previousGameCommand;
        Engine.hero = { d: { id: 7 } };
        Engine.communication.parseJSON({ f: { myteam: 1, w: {
            hero: { originalId: 7, team: 1, prof: 'w', name: 'Quesh' },
            hunter: { originalId: 8, team: 1, prof: 'h', name: 'Łowca' },
            warrior: { originalId: 9, team: 1, prof: 'w', name: 'Wojownik' }
        } } });
        Engine.communication.parseJSON({ loot: { init: 1, endTs: 1030 }, item: {
            501: { id: 501, loc: 'l', stat: 'rarity=legendary;reqp=w' }
        } });
        await wait(180);
        assert(document.querySelector('.qaddons-loot-chance')?.textContent === '50%', 'Kto złapie? pokazuje 50% dla dwóch wojowników');
        assert(document.querySelector('.qaddons-loot-chance')?.title.includes('Quesh (ty)'), 'Lista losujących wskazuje bohatera');
        Engine.communication.parseJSON({ loot: { init: 0 } });
        Engine.communication.parseJSON({ f: { w: { hero: { originalId: 7, team: '1', prof: 'w', name: 'Quesh' } } } });
        Engine.communication.parseJSON({ loot: { init: 1 }, item: { 502: { id: 502, stat: 'rarity=legendary' } } });
        await wait(180);
        assert(document.querySelector('.qaddons-loot-chance')?.textContent === '100%', 'Kto złapie? pokazuje wynik także w walce solo');
        Engine.communication.parseJSON({ loot: { init: 0 } });
        __MARGONEM_TOOLKIT__.open();
        [...document.querySelectorAll('.mtk-addon')].find(node => node.textContent.includes('Kto złapie?')).querySelector('button').click();
        document.querySelector('[data-test-loot]').click(); await wait(60);
        assert(document.querySelector('.qaddons-loot-test .qaddons-loot-chance')?.textContent === '50%', 'Test Kto złapie? otwiera przykładową legendę');
        document.querySelector('.qaddons-loot-test-close').click();
        __MARGONEM_TOOLKIT__.open();
        document.querySelector('#qaddons-reminder-button').click();
        await wait(80);
        assert(document.querySelector('#qaddons-reminder:not([hidden])'), 'Przypominajka pokazuje wygasły przedmiot');
        assert(!document.querySelector('#qaddons-reminder .qrp-row b'), 'Nazwa przedmiotu nie jest interpretowana jako HTML');
        const destroyExpired = document.querySelector('#qaddons-reminder [data-action="expired"]');
        destroyExpired.click();
        assert(destroyExpired.dataset.confirmed === 'true' && !destroyExpired.disabled, 'Usuwanie wymaga drugiego kliknięcia');
        document.querySelector('#qaddons-reminder .qrp-close').click();
        assert(document.querySelector('#qaddons-reminder').hidden, 'Przypominajkę można zamknąć');
        manager.setEnabled('reminder', false);
        assert(!document.querySelector('#qaddons-reminder') && !document.querySelector('#qaddons-reminder-button'), 'Wyłączenie sprząta Przypominajkę');
        assert(!document.querySelector('[data-mtk-style="reminder:runtime"]'), 'Wyłączenie usuwa style Przypominajki');
        manager.setEnabled('reminder', true);
        assert(getComputedStyle(document.querySelector('#mtk-panel')).backgroundColor === 'rgb(0, 0, 0)', 'Czarny panel');
        assert(getComputedStyle(document.querySelector('#mtk-button')).borderRadius === '0px', 'Kwadratowy przycisk');
        assert(document.querySelector('#mtk-button').getBoundingClientRect().width === 44, 'Przycisk dopasowany do przycisków gry');
        assert(document.querySelector('#mtk-button').parentElement.matches('.top-left.main-buttons-container'), 'Przycisk QADDONS osadzony w górnej belce gry');
        const oldButtonHost = document.querySelector('.top-left.main-buttons-container');
        const rebuiltButtonHost = oldButtonHost.cloneNode(false);
        oldButtonHost.replaceWith(rebuiltButtonHost);
        await wait(40);
        assert(document.querySelector('#mtk-button')?.parentElement === rebuiltButtonHost, 'Przycisk wraca po przebudowie belki gry');
        document.querySelector('.mtk-addon button').click();
        assert(document.querySelectorAll('.ln-tab-button').length === 11, '11 zakładek');
        assert(document.querySelector('.ln-tab-content').getBoundingClientRect().width > 300, 'Ustawienia wykorzystują szerokość panelu');
        assert(document.querySelector('.ln-panel-foot').getBoundingClientRect().top >= document.querySelector('.ln-panel-body').getBoundingClientRect().bottom - 1, 'Stopka pod formularzem');
        assert(!document.querySelector('[data-key="notificationBottomOffset"]'), 'Wydzielone ustawienia powiadomień');
        document.querySelector('[data-tab="canvas"]').click();
        assert(document.querySelector('[data-pane="canvas"]').classList.contains('active'), 'Zakładka CANVAS');
        assert(document.querySelector('[data-key="canvasInnerIntensity"]'), 'Ustawienie inward intensity');
        __MARGONEM_TOOLKIT__.open();
        const toggle = document.querySelector('.mtk-addon input');
        toggle.click();
        assert(!manager.list()[0].enabled, 'Checkbox wyłącza addon');
        document.querySelector('.mtk-addon button').click();
        assert(document.querySelector('[data-action="test"]').disabled, 'TESTUJ wyłączone bez addonu');
        document.querySelector('[data-addon-enabled]').click();
        assert(manager.list()[0].enabled, 'Włączenie z ustawień');
        document.querySelector('[data-action="test"]').click();
        await wait(180);
        assert(document.querySelector('.loot-wnd .item[data-item-type="t-leg"]'), 'TESTUJ używa parsera');
        __MARGONEM_TOOLKIT__.open();
        document.querySelectorAll('.mtk-addon button')[1].click();
        const bottom = document.querySelector('#mtk-content input[type="range"]');
        bottom.value = '100';
        bottom.dispatchEvent(new Event('change', { bubbles: true }));
        assert(getComputedStyle(document.querySelector('.big-messages')).bottom === '100px', 'Pozycja powiadomień');
        assert(document.querySelector('.console-layer').style.top === '17px', 'Konsola bez zmian');
        const notificationText = document.querySelector('.big-messages span');
        const consoleSize = getComputedStyle(document.querySelector('.console-layer')).fontSize;
        function changeTypography(key, value) {
            const input = document.querySelector(`[data-notification-setting="${key}"]`);
            if (input.type === 'checkbox') input.checked = value;
            else input.value = value;
            input.dispatchEvent(new Event('change', { bubbles: true }));
        }
        assert(getComputedStyle(notificationText).fontSize === '15px', 'Domyślna czcionka gry zachowana');
        changeTypography('customTypography', true);
        changeTypography('fontSize', 24);
        changeTypography('fontFamily', 'georgia');
        changeTypography('fontWeight', '700');
        changeTypography('italic', true);
        changeTypography('shadow', 'outline');
        assert(getComputedStyle(notificationText).fontSize === '24px', 'Rozmiar także w zagnieżdżonym tekście');
        assert(getComputedStyle(notificationText).fontFamily.includes('Georgia'), 'Wybrana czcionka');
        assert(getComputedStyle(notificationText).fontWeight === '700', 'Grubość tekstu');
        assert(getComputedStyle(notificationText).fontStyle === 'italic', 'Kursywa');
        assert(getComputedStyle(notificationText).color === 'rgb(160, 170, 180)', 'Domyślnie zachowane kolory gry');
        changeTypography('customColor', true);
        changeTypography('color', '#abcdef');
        assert(getComputedStyle(notificationText).color === 'rgb(171, 205, 239)', 'Własny kolor');
        const lateMessage = document.createElement('div');
        lateMessage.innerHTML = '<span style="color:red!important;font-family:Arial!important;font-size:12px!important">Nowe powiadomienie</span>';
        document.querySelector('.big-messages').append(lateMessage);
        const lateText = lateMessage.firstElementChild;
        await wait(80);
        assert(getComputedStyle(lateText).color === 'rgb(171, 205, 239)' && getComputedStyle(lateText).fontSize === '24px', 'Nowy komunikat z własnym inline important');
        lateText.style.setProperty('color', '#112233', 'important');
        lateText.style.setProperty('font-size', '13px', 'important');
        await wait(80);
        assert(getComputedStyle(lateText).color === 'rgb(171, 205, 239)' && getComputedStyle(lateText).fontSize === '24px', 'Późniejsza aktualizacja gry nie usuwa konfiguracji');
        assert(getComputedStyle(document.querySelector('.console-layer')).fontSize === consoleSize, 'Typografia konsoli bez zmian');
        manager.setEnabled('notification-position', false);
        assert(lateText.style.color === 'rgb(17, 34, 51)' && lateText.style.fontSize === '13px', 'Wyłączenie przywraca ostatnie wartości gry');
        lateMessage.remove();
        assert(getComputedStyle(notificationText).fontSize === '15px', 'Wyłączenie przywraca typografię gry');
        manager.setEnabled('notification-position', true);
        assert(getComputedStyle(notificationText).fontSize === '24px', 'Ponowne włączenie odtwarza wygląd');
        __MARGONEM_TOOLKIT__.open();
        document.querySelectorAll('.mtk-addon button')[1].click();
        assert(document.querySelector('[data-notification-setting="fontSize"]').value === '24', 'Ustawienia zachowane po otwarciu');
        document.querySelector('[data-reset-typography]').click();
        assert(getComputedStyle(notificationText).fontSize === '15px', 'Reset przywraca czcionkę gry');
        assert(getComputedStyle(notificationText).color === 'rgb(160, 170, 180)', 'Reset przywraca kolor gry');
        assert(getComputedStyle(document.querySelector('.big-messages')).bottom === '100px', 'Reset wyglądu zachowuje pozycję');
        __MARGONEM_TOOLKIT__.open();
        document.querySelector('[data-close]').click();

        for (const loc of ['l', 'k']) {
            Engine.communication.parseJSON(packet(loc));
            await wait(180);
            assert(document.querySelectorAll('.ln-fx[data-kind="card"]').length === 1, `Karta mieszana ${loc}: ${JSON.stringify(LegendaryNotificator.status())}, hidden=${document.hidden}`);
            assert(document.querySelectorAll('.ln-fx[data-kind="item"]').length === 1, `Item mieszany ${loc}`);
            assert(document.querySelector('.ln-fx[data-kind="outer"]'), `Outer ${loc}`);
            assert(document.querySelector('.ln-local-fx'), `Lokalny canvas ${loc}`);
            for (const preset of ['referenceCyanTube', 'referenceCyanStrong', 'referenceCyanBreathe', 'referenceCyanOrbit', 'referenceCyanScanner', 'referencePink', 'cyberViolet', 'goldenLegend', 'performance', 'minimal']) {
                LegendaryNotificator.preset(preset);
                await wait(40);
                assert(document.querySelector('.ln-fx'), `Preset ${preset}`);
            }
            manager.setEnabled('legendary-notificator', false);
            assert(!document.querySelector('.ln-fx'), 'Usunięcie overlayów');
            assert(!document.querySelector('[data-mtk-style="legendary-notificator:effects"]'), 'Usunięcie styli efektów');
            assert(gameLayer.style.position === initialPosition && gameLayer.style.isolation === initialIsolation, 'Przywrócenie stylu canvas');
            manager.setEnabled('legendary-notificator', true);
            LegendaryNotificator.preset('referenceCyanTube');
            Engine.communication.parseJSON(packet(loc, false));
            await wait(100);
            assert(!document.querySelector('.ln-fx'), 'Zwykły loot bez legendy');
        }
        manager.changeSettings('legendary-notificator', { worldEnabled: true });
        Engine.communication.parseJSON(packet('k'));
        await wait(150);
        assert(document.getElementById('ln580-world'), 'Aura świata');
        const unrelated = document.createElement('div');
        unrelated.className = 'c-window addon-window';
        unrelated.innerHTML = '<div class="item" data-item-type="t-leg"></div>';
        document.body.append(unrelated);
        Engine.communication.parseJSON({ loot: { init: 0 } });
        await wait(150);
        assert(!document.querySelector('.ln-fx'), 'Zamknięty loot; addonowe okno nie jest celem');
        assert(!document.getElementById('ln580-world'), 'Cleanup aury');
        manager.setEnabled('notification-position', false);
        assert(!document.querySelector('[data-mtk-style="notification-position:position"]'), 'Cleanup powiadomień');
        assert(Engine.communication.parseJSON === parser, 'Brak dodatkowych hooków');
        await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = '../dist/margonem-toolkit.js?restart';
            script.onload = resolve;
            script.onerror = reject;
            document.body.append(script);
        });
        assert(document.querySelectorAll('#mtk-button').length === 1, 'Singleton panelu po reexec');
        __MARGONEM_TOOLKIT__.destroy();
        assert(Engine.communication.parseJSON === fixtureOriginalParser, 'Przywrócenie oryginalnego parsera po reexec');
        assert(!document.querySelector('[data-mtk-style]'), 'Cleanup wszystkich styli');
        assert(!document.getElementById('mtk-panel'), 'Cleanup panelu');
        assert(fixtureErrors.length === 0, fixtureErrors.join('\n'));
        document.getElementById('result').textContent = 'PASS: ten addons, compact party, reminder, loot chances, enhancer drag-drop, native relogging, quick seller, relogger, item tools, detector, notification typography, lifecycle, singleton';
    }
    window.addEventListener('DOMContentLoaded', () => {
        run().catch(error => {
            document.getElementById('result').textContent = `FAIL: ${error.stack}\n${fixtureErrors.join('\n')}`;
        });
    }, { once: true });
</script>
</html>
